services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
    environment:
      # Ollama runs on the host (not in Docker) so it can use your GPU.
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      GRAMMAR_MODEL: ${GRAMMAR_MODEL:-${OLLAMA_MODEL:-llama3.2:3b}}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      PIPER_VOICE_NAME: ${PIPER_VOICE_NAME:-fr_FR-siwis-medium}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      # Loopback by default: the app has no authentication, so it should not be
      # reachable from the rest of the network. Set PARLE_BIND=0.0.0.0 to expose it.
      - "${PARLE_BIND:-127.0.0.1}:${PARLE_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
